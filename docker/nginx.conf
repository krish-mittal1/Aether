upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Increase timeout for code execution (C++ compile can take time)
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # Max upload for folder import (5MB limit enforced in backend too)
    client_max_body_size 10m;

    # WebSocket upgrade headers for Socket.IO
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Socket.IO path
    location /socket.io/ {
        proxy_pass http://backend;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend;
    }

    # Backend health
    location /health {
        proxy_pass http://backend;
    }

    # Everything else goes to Next.js frontend
    location / {
        proxy_pass http://frontend;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets — longer cache
    location /_next/static/ {
        proxy_pass http://frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
