# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this adds:
#   - nginx reverse proxy (single public port 80)
#   - removes direct port exposure from backend/frontend
#   - enables nginx → backend WebSocket proxying

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  backend:
    ports: []   # Remove direct port in prod; nginx handles routing
    command: >
      sh -c "(prisma migrate deploy --schema=/app/src/prisma/schema.prisma ||
             prisma db push --schema=/app/src/prisma/schema.prisma) &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1 --h11-max-incomplete-event-size 629145600"
    volumes: []

  frontend:
    build:
      context: ./frontend
      args:
        # In production these should point to your actual domain
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports: []   # Remove direct port in prod; nginx handles routing
